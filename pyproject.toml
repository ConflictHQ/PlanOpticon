[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "planopticon"
version = "1.0.0"
description = "AI-powered video analysis and knowledge extraction tool"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "CONFLICT LLC" },
]
keywords = ["video", "analysis", "ai", "knowledge-extraction", "transcription", "diagrams"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24.0",
    "opencv-python>=4.8.0,<5",
    "scipy>=1.10.0",
    "pillow>=10.0.0",
    "matplotlib>=3.7.0",
    "pydantic>=2.0.0",
    "tqdm>=4.66.0",
    "colorlog>=6.7.0",
    "click>=8.1.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "openai>=1.0.0",
    "anthropic>=0.5.0",
    "google-genai>=1.0.0",
    "markdown>=3.4.0",
    "mermaid-py>=0.5.0",
    "plotly>=5.18.0",
    "kaleido>=0.2.1",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.24.0"]
exports = ["reportlab>=4.0", "python-pptx>=1.0"]
gpu = ["torch>=2.0.0", "torchvision>=0.15.0"]
gdrive = ["google-auth>=2.0.0", "google-auth-oauthlib>=1.0.0", "google-api-python-client>=2.0.0"]
dropbox = ["dropbox>=12.0.0"]
azure = ["openai>=1.0.0"]
together = ["openai>=1.0.0"]
fireworks = ["openai>=1.0.0"]
cerebras = ["openai>=1.0.0"]
xai = ["openai>=1.0.0"]
bedrock = ["boto3>=1.28"]
vertex = ["google-cloud-aiplatform>=1.38"]
mistral = ["mistralai>=1.0"]
cohere = ["cohere>=5.0"]
ai21 = ["ai21>=3.0"]
huggingface = ["huggingface_hub>=0.20"]
qianfan = ["qianfan>=0.4"]
litellm = ["litellm>=1.0"]
youtube = ["yt-dlp>=2023.0"]
s3 = ["boto3>=1.28"]
web = ["beautifulsoup4>=4.12"]
rss = ["feedparser>=6.0"]
graph = []
cloud = [
    "planopticon[gdrive]",
    "planopticon[dropbox]",
    "planopticon[s3]",
]
sources = [
    "planopticon[youtube]",
    "planopticon[web]",
    "planopticon[rss]",
]
dev = [
    "pytest>=7.3.0",
    "pytest-cov>=4.1.0",
    "black>=23.3.0",
    "isort>=5.12.0",
    "mypy>=1.3.0",
    "ruff>=0.1.0",
    "networkx>=3.0",
    "reportlab>=4.0",
    "python-pptx>=1.0",
    "dropbox>=12.0.0",
]
all = [
    "planopticon[pdf]",
    "planopticon[cloud]",
    "planopticon[graph]",
    "planopticon[dev]",
]

[project.urls]
Homepage = "https://planopticon.dev"
Documentation = "https://planopticon.dev"
Repository = "https://github.com/ConflictHQ/PlanOpticon"
Issues = "https://github.com/ConflictHQ/PlanOpticon/issues"

[project.scripts]
planopticon = "video_processor.cli.commands:main"

[tool.setuptools.packages.find]
include = ["video_processor*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"video_processor/utils/prompt_templates.py" = ["E501"]
"video_processor/api/openapi_spec.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov=video_processor"
