name: CI

# Gates by event (docs/contributing.md#test-tiers):
#   PR and merge queue  -> always + sometimes, full OS/Python matrix
#   push to main        -> always only; the PR already ran always + sometimes
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

jobs:
  test-pr:
    if: github.event_name != 'push'
    uses: ./.github/workflows/test-tier.yml
    with:
      target: test-pr

  test-main:
    if: github.event_name == 'push'
    uses: ./.github/workflows/test-tier.yml
    with:
      target: test
      os: '["ubuntu-latest"]'
      python-versions: '["3.12"]'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install ruff mypy

      - name: Ruff
        run: ruff check video_processor/

      - name: Type check
        run: mypy video_processor/ --ignore-missing-imports || true
